${g.st=="open"?`<label>Your availability</label><input id="av" value="${fmt(g.d)}, ${g.h}"><label>Short intro</label><input id="im" placeholder="Hi! I'm a 2nd year student…"><label style="font-weight:600"><input type="checkbox" id="ag" style="width:auto"> Work agreement: I will arrive on time, do the listed tasks, stay respectful, and check in/out in Giglet.</label><p><button class="btn sun" onclick="apply(${id})">Apply for this gig</button> <button class="btn" onclick="ask(${id})">💬 Message employer</button> <button class="btn alt" onclick="closeM()">Close</button></p>`:'<p class="chip">This gig is closed</p>'}`)}
const gs=()=>{if(!U()||U().role!="student"){toast("Log in as a student first.");closeM();go("login");return 1}};
function rep(id){const w=prompt("What looks suspicious?");if(w){S.reps.push({id:Date.now(),g:id,why:w,s:"Open"});sv();toast("Report sent to admins")}}
function ask(id){if(gs())return;closeM();chat(id+"|"+U().name)}
function apply(id){if(gs())return;{const sd=S.studs[U().name];if(sd&&sd.age<18&&sd.cons!="verified")return toast("Guardian consent must be verified first. Open your profile.")}const g=gg(id),u=U(),av=$("#av").value.trim();if(!av)return toast("Add your availability.");if(!$("#ag").checked)return toast("Please accept the work agreement.");
if(S.apps.some(a=>a.g==id&&a.who==u.name&&!["Withdrawn","Rejected"].includes(a.s)))return toast("You already applied.");
const cl=S.apps.find(a=>a.who==u.name&&["Pending","Accepted"].includes(a.s)&&gg(a.g).d==g.d);if(cl&&!confirm("You already have a gig on this date. Apply anyway?"))return;
S.apps.push({id:S.nid++,g:id,who:u.name,av,msg:$("#im").value,s:"Pending"});note(g.e,`${u.name} applied to ${g.t}.`);sv();closeM();toast("Application submitted!");confetti(40);TB.s="a";go("student")}
function chat(k){const[gid,who]=k.split("|"),g=gg(gid),r=U()?.role||"student";modal(`<h2>💬 ${esc(g.t)}</h2><p class="note">${r=="student"?"You and "+esc(g.e):"You and "+esc(who)}. Keep contact details private until you're confirmed.</p><div class="ms" id="tm"></div><form class="cf" onsubmit="sendM(event,'${k.replace(/'/g,"\\'")}')"><input id="ti" placeholder="Type a message" required><button class="btn sm sun">Send</button></form><button class="btn sm alt" onclick="if(confirm('Block and report this chat?')){rep(${gid});closeM()}">🚫 Block / report</button>`);drawT(k)}
function drawT(k){const r=U()?.role||"student",el=$("#tm");if(!el)return;S.rd[k+r]=(S.th[k]||[]).length;sv();el.innerHTML=(S.th[k]||[]).map(m=>`<div class="b ${m.f==r?"me":""}">${esc(m.x)}</div>`).join("")||'<p class="note">Say hi 👋</p>';el.scrollTop=1e9}
function sendM(e,k){e.preventDefault();const r=U()?.role||"student",[gid,who]=k.split("|"),g=gg(gid),v=$("#ti").value;(S.th[k]=S.th[k]||[]).push({f:r,x:v});note(r=="student"?g.e:who,`New message about ${g.t}.`);sv();drawT(k);if(r=="student")setTimeout(()=>{(S.th[k]=S.th[k]||[]).push({f:"employer",x:"Thanks for asking! We'll review your message shortly."});sv();drawT(k)},1200)}
function drawList(){const f=F,u=U(),o=$("#fo")?.value||"r";let L=S.gigs.filter(g=>g.st=="open"&&!S.sus.includes(g.e)&&(!f.q||(g.t+g.e+g.x+g.c).toLowerCase().includes(f.q.toLowerCase()))&&(!f.m||g.m==f.m)&&(!f.c||g.c==f.c)&&(!f.d||g.d==f.d)&&(!f.v||ver(g))&&(!f.r||g.r>=f.r)&&(!f.s||S.saved.includes(g.id)));
L.sort((a,b)=>o=="d"?(a.d>b.d?1:-1):o=="p"?P(b)-P(a):b.r-a.r);$("#list").innerHTML=L.map(card).join("")||'<p>No gigs match. Clear a filter to see more.</p>'}
function bindF(){const m={fq:"q",fm:"m",fc:"c",fd:"d",fr:"r"};for(const[i,k]of Object.entries(m)){const el=$("#"+i);el.value=F[k]||"";el.oninput=el.onchange=()=>{F[k]=el.value;drawList()}}
$("#fv").checked=!!F.v;$("#fs").checked=!!F.s;$("#fv").onchange=e=>{F.v=e.target.checked;drawList()};$("#fs").onchange=e=>{F.s=e.target.checked;drawList()};$("#fo").onchange=drawList;drawList()}
function render(){chrome();const r=route();$("#app").innerHTML=(views[r]||views.home)();fx();if(r=="gigs")bindF();if(r=="map")initMap();const bd=$("#bd");if(bd)bd.max=new Date().toISOString().slice(0,10)}
addEventListener("hashchange",()=>{if(route()!="gigs"&&route()!="home")F=F;render();scrollTo(0,0)});
const KB=[[/apply|application/,"Open a gig, ask the employer anything, then add your availability and tap Apply. No one-click applying! 💚"],[/accept|status|got the job/,"You'll get a notification when the employer decides. Check Applications in your dashboard: Pending, Accepted, Rejected, Withdrawn or Completed."],[/pay|gcash|maya|money/,"Employers pay you directly by cash, GCash, Maya, or bank. After the gig both sides confirm in Giglet."],[/post|employer/,"Employers: open your dashboard, go to Post a gig, then manage applicants and confirm completed work."],[/safe|scam|report|trust/,"Look for ✔ Verified, never pay to get a gig, chat only inside Giglet, and use 🚩 Report if something feels off."],[/age|parent|consent|minor/,"Under 15 can't register. Ages 15–17 need guardian details and have hour limits. 18+ follow adult rules."],[/badge|point|reward|passport|level/,"Every confirmed gig earns 10 points and a Passport stamp. Badges unlock at 1, 5 and 10 gigs, plus a 5-star review."],[/earn|how much/,()=>U()&&U().role=="student"?`You've earned ₱${earn(U().name)} so far. Keep going! 🌟`:"Log in as a student to see your earnings."],[/recommend|suggest|best/,()=>{const g=live().filter(ver).sort((a,b)=>P(b)-P(a))[0];return g?`Top pick: ${g.t} in ${g.m}, about ₱${P(g)}.`:"No gigs right now."}],[/fee|service/,"Giglet charges employers ₱20 per completed gig. Students keep 100% of listed pay."]];
const say=(x,me)=>{const d=document.createElement("div");d.className="b"+(me?" me":"");d.textContent=x;$("#gm").append(d);$("#gm").scrollTop=1e9};
async function gask(q){say(q,1);if(await aiAsk(q))return;const k=KB.find(k=>k[0].test(q.toLowerCase()));setTimeout(()=>say(k?(typeof k[1]=="function"?k[1]():k[1]):"I can help with applying, status, pay, safety, rewards, fees and posting gigs. Try one! 🍃"),350)}
$("#cb").onclick=()=>{$("#chat").classList.toggle("open");if(!$("#gm").children.length){say(T().hi);$("#gc").innerHTML=["How do I apply?","How do I get paid?","Is it safe?","Recommend a gig","What are badges?"].map(x=>`<button>${x}</button>`).join("");$("#gc").onclick=e=>e.target.tagName=="BUTTON"&&gask(e.target.textContent)}};
$("#gf").onsubmit=e=>{e.preventDefault();const v=$("#gi").value.trim();if(v){gask(v);$("#gi").value=""}};
render();
</script></body></html>
