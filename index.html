Object.entries(MU).forEach(([n,c])=>{const k=live().filter(g=>g.m==n).length;L.marker(c,{icon:L.divIcon({className:"",html:`<div class="mk"><b>${k}</b></div>`,iconSize:[30,30],iconAnchor:[15,30]})}).addTo(LM).on("click",()=>{MS=n;LM.flyTo(c,12);pl()})});pl()}
function loc(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{LM.flyTo([p.coords.latitude,p.coords.longitude],12);toast("Showing your area")},()=>toast("Location blocked. Pick a town pin instead.")):toast("Location not supported")}
function ageGate(){modal(`<h2>👋 Before we start</h2><p>Giglet is for ages <b>15+</b>. How old are you?</p><p><button class="btn" onclick="S.band='u15';ss('band','u15');ageMsg()">Under 15</button> <button class="btn sun" onclick="S.band='teen';ss('band','teen');closeM();toast('Ages 15–17 need guardian consent')">15–17</button> <button class="btn sun" onclick="S.band='adult';ss('band','adult');closeM()">18+</button></p>`)}
function ageMsg(){modal(`<h2>Not yet 🌱</h2><p>Giglet is only for ages 15 and up. Ask a parent or guardian about safe ways to earn, and come back when you turn 15!</p><button class="btn alt" onclick="closeM()">Okay</button>`)}
function ageInfo(){modal(`<h2>Age rules</h2><div class="g4"><div class="card"><h3>Under 15</h3><p class="note">Not allowed to work on Giglet.</p></div><div class="card"><h3>15–17</h3><p class="note">Guardian consent, light work only, max 8 hrs, no night or hazardous work.</p></div><div class="card"><h3>18+</h3><p class="note">Adult rules apply.</p></div></div><button class="btn alt" onclick="closeM()">Close</button>`)}
/* ---------- Gigi ---------- */
const KB=[[/apply|application/,"Open a gig, ask the employer anything, then add your availability and tap Apply. No one-click applying! 💚"],[/accept|status|got the job/,"You'll get a notification when the employer decides. Check Applications in your dashboard."],[/pay|gcash|maya|money/,"Employers pay you directly by cash, GCash, Maya, or bank. After the gig both sides confirm in Giglet."],[/post|employer/,"Employers: sign up, get verified by an admin, then open your dashboard > Post a gig."],[/safe|scam|report|trust/,"Look for ✔ Verified, never pay to get a gig, chat only inside Giglet, and use 🚩 Report if something feels off."],[/age|parent|consent|minor/,"Under 15 can't register. Ages 15–17 need verified guardian consent and have hour limits. 18+ follow adult rules."],[/badge|point|reward|passport|level/,"Every confirmed gig earns 10 points and a Passport stamp. Badges unlock at 1, 5 and 10 gigs, plus a 5-star review."],[/fee|service/,"Giglet charges employers ₱20 per completed gig. Students keep 100% of listed pay."]];
const say=(x,me)=>{const d=document.createElement("div");d.className="b"+(me?" me":"");d.textContent=x;$("#gm").append(d);$("#gm").scrollTop=1e9};
async function aiAsk(q){HIST.push({role:"user",content:q});try{const r=await fetch("/api/gigi",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:HIST.slice(-6),lang:S.lang,role:role()||"visitor",gigs:live().slice(0,8).map(g=>`${g.t} in ${g.m}, P${g.r}/hr, ${g.d}`)})});if(!r.ok)return false;const j=await r.json();if(!j.text)return false;say(j.text);HIST.push({role:"assistant",content:j.text});return true}catch(e){return false}}
async function gask(q){say(q,1);if(await aiAsk(q))return;const k=KB.find(k=>k[0].test(q.toLowerCase()));say(k?k[1]:"I can help with applying, status, pay, safety, rewards, fees and posting gigs. Try one! 🍃")}
$("#cb").onclick=()=>{$("#chat").classList.toggle("open");if(!$("#gm").children.length){say(T().hi);$("#gc").innerHTML=["How do I apply?","How do I get paid?","Is it safe?","What are badges?"].map(x=>`<button>${x}</button>`).join("");$("#gc").onclick=e=>e.target.tagName=="BUTTON"&&gask(e.target.textContent)}};
$("#gf").onsubmit=e=>{e.preventDefault();const v=$("#gi").value.trim();if(v){gask(v);$("#gi").value=""}};
/* ---------- boot ---------- */
function render(){chrome();const r=route();$("#app").innerHTML=(views[r]||views.home)();fx();if(r=="gigs")bindF();if(r=="map")initMap();const bd=$("#bd");if(bd)bd.max=new Date().toISOString().slice(0,10)}
addEventListener("hashchange",async()=>{CUR="";render();scrollTo(0,0);if(S.user||route()!="home"){await load();if(!$("#mod")&&!document.activeElement?.closest?.("form"))render()}});
let sb;
if(!window.supabase){$("#app").innerHTML='<section class="card"><h2>Could not load</h2><p>The Giglet database library failed to load. Check your internet connection and refresh.</p></section>'}
else{sb=supabase.createClient(SB_URL,SB_KEY);render();
 sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(async()=>{S.user=ses?.user||null;if(ev=="PASSWORD_RECOVERY"){recov();return}if(!S.user){S.p=null}await load();const r=route();if(ev=="SIGNED_IN"&&(r=="login"||r=="signup"))go(dash());else if(ev=="SIGNED_OUT")go("home");else render()},0)});
 if(!S.band)setTimeout(ageGate,900)}
</script></body></html>
