<form id="gform" onsubmit="subG(event,'${t}')"><label>Your full name</label><input name="gname" required minlength="3"><label>Relationship to the student</label><select name="rel"><option>Mother</option><option>Father</option><option>Legal guardian</option><option>Other</option></select><label>Your mobile number</label><input name="gphone" type="tel" inputmode="tel" required placeholder="09xx xxx xxxx"><label>Your email (optional)</label><input name="gemail" type="email"><label>Home address</label><input name="gaddr" required>
<label>Emergency information (allergies, medical conditions, hospital preference)</label><textarea name="notes" placeholder="e.g. Allergic to peanuts. Call me first."></textarea>
<label>Photo of your valid ID (clear, all corners visible)</label><input type="file" id="gid" accept="image/*" required><label>A photo of yourself (selfie)</label><input type="file" id="gph" accept="image/*" capture="user" required>
<label>Your signature (draw with your finger)</label><canvas id="sig" width="500" height="180" style="width:100%;border:2.5px solid var(--bd);border-radius:14px;background:#fff"></canvas><p><button type="button" class="btn sm alt" onclick="sigClear()">Clear signature</button></p>
<label style="font-weight:600"><input type="checkbox" required style="width:auto"> I am the parent or legal guardian. I approve this student's participation and agree that Giglet may process the information and photos above for verification and emergencies, as stated in its Privacy notice (RA 10173).</label>
<p><button class="btn sun">Submit consent</button></p></form></div></section>`;sigInit()}
async function subG(e,t){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),b=e.target.querySelector("button.sun"),idf=$("#gid").files[0],pf=$("#gph").files[0];if(!idf||!pf)return toast("Please add the ID photo and your photo.");if(!SIGN)return toast("Please sign in the box.");b.disabled=true;toast("Uploading… please wait");
 try{const up=async(blob,n,ext)=>{const path=`guardian/${t}/${n}-${Date.now()}.${ext}`,r=await sb.storage.from("consent-docs").upload(path,blob,{contentType:ext=="png"?"image/png":"image/jpeg"});if(r.error)throw r.error;return path};
  const idp=await up(await shrink(idf),"id","jpg"),php=await up(await shrink(pf),"photo","jpg"),sg=await new Promise(res=>$("#sig").toBlob(res,"image/png")),sigp=await up(sg,"sig","png");
  const r=await sb.rpc("submit_guardian_consent",{t,gname:f.gname,rel:f.rel,gphone:f.gphone,gemail:f.gemail||null,gaddr:f.gaddr||null,notes:f.notes||null,idp,php,sigp});if(r.error)throw r.error;
  $("#app").innerHTML='<section class="card" style="max-width:560px;margin:auto"><h2>✔ Thank you!</h2><p>Your consent was received and approved. The student can now apply to gigs. You may close this page.</p></section>';confetti(50)}
 catch(er){toast(er.message||"Upload failed");b.disabled=false}}
async function viewDocs(id){const c=S.crs.find(x=>x.id==id);modal(`<h2>Consent documents</h2><div id="dl"><p class="note">Loading links…</p></div><p class="note">Links expire in 2 minutes.</p><button class="btn alt" onclick="closeM()">Close</button>`);const L=[["Parent ID",c.id_path],["Parent photo",c.photo_path],["Signature",c.signature_path]];let h="";for(const[n,p]of L){const r=await sb.storage.from("consent-docs").createSignedUrl(p,120);h+=r.data?`<p><a target="_blank" rel="noopener" href="${r.data.signedUrl}">Open ${n}</a></p>`:`<p class="note">${n}: unavailable</p>`}$("#dl").innerHTML=h+`<p class="note">Emergency notes: ${esc(c.emergency_notes||"—")}<br>Address: ${esc(c.guardian_address||"—")}<br>Email: ${esc(c.guardian_email||"—")}</p>`}
/* ---------- emergency + payment accounts ---------- */
async function emerg(sid){modal(`<h2>🚑 Emergency information</h2><div id="em"><p class="note">Loading…</p></div><p class="note">Private. Shown only for gigs this student is accepted for. Use only in an emergency.</p><button class="btn alt" onclick="closeM()">Close</button>`);const r=await sb.rpc("emergency_info",{s:sid}),d=r.data;$("#em").innerHTML=d?`<p><b>${esc(d.student)}</b>, age ${d.age}</p><p>Guardian: <b>${esc(d.guardian_name||"—")}</b> ${esc(d.relationship||"")}<br>Phone: <b>${esc(d.guardian_phone||"—")}</b><br>Address: ${esc(d.address||"—")}</p><p>Emergency contact: <b>${esc(d.emergency_contact||"—")}</b></p><p>Medical notes: ${esc(d.notes||"None provided")}</p>`:'<p class="note">Not available.</p>'}
async function payTo(sid){modal(`<h2>💳 Pay this student</h2><div id="pt"><p class="note">Loading…</p></div><button class="btn alt" onclick="closeM()">Close</button>`);const r=await sb.rpc("payout_info",{s:sid}),d=r.data;$("#pt").innerHTML=d&&d.number?`<p>Method: <b>${esc(d.method||"")}</b><br>Account name: <b>${esc(d.name||"")}</b><br>Number: <b>${esc(d.number)}</b></p><button class="btn sm sun" onclick="navigator.clipboard.writeText('${esc(d.number)}');toast('Copied')">Copy number</button><p class="note">Pay in your GCash, Maya or banking app, then tap Record payment.</p>`:'<p class="note">The student has not saved payout details. Ask in chat, or pay in cash.</p>'}
function payModal(id){modal(`<h2>Record payment</h2><p class="note">Pay the student directly (GCash, Maya, bank, cash or other), then record it here. The student confirms.</p><label>Method</label><select id="pm" onchange="$('#po').style.display=this.value=='Other'?'block':'none'">${[...PAYM,"Other"].map(m=>`<option>${m}</option>`).join("")}</select><input id="po" placeholder="Describe the method" style="display:none"><label>Reference no. (optional)</label><input id="pr"><label>Photo of receipt or screenshot (optional)</label><input type="file" id="pf" accept="image/*"><p><button class="btn sun" onclick="savePay(${id})">Save</button> <button class="btn alt" onclick="closeM()">Cancel</button></p>`)}
async function savePay(id){let m=$("#pm").value;if(m=="Other")m=$("#po").value.trim()||"Other";const ref=$("#pr").value,f=$("#pf").files[0];let path=null;if(f){try{const b=await shrink(f);path=`${S.user.id}/proof-${Date.now()}.jpg`;const u=await sb.storage.from("consent-docs").upload(path,b,{contentType:"image/jpeg"});if(u.error)return toast(u.error.message)}catch(e){return toast(e.message)}}
 closeM();act(sb.from("applications").update({pay_status:"paid",pay_method:m,pay_ref:ref,paid_at:new Date().toISOString(),pay_proof_path:path}).eq("id",id),"Payment recorded")}
/* ---------- reviews ---------- */
function revTab(){const st=role()=="student",c=S.apps.filter(a=>a.status=="Completed"),got=st?c.filter(a=>a.rating_quality):c.filter(a=>a.employer_rating),r3=a=>Math.round(((a.rating_quality||0)+(a.rating_punctuality||0)+(a.rating_attitude||0))/3),todo=st?c.filter(a=>!a.employer_rating):[];
 return `<div class="card"><h3>⭐ Reviews about ${st?"you":"your business"}</h3>${got.map(a=>{const g=gg(a.gig_id)||{},r=st?r3(a):a.employer_rating;return `<div class="row"><div><b>${"⭐".repeat(r)}</b> ${esc(g.t||"")}<br><span class="note">${st?esc(en(g)):esc(S.stu[a.student_id]?.full_name||"Student")}: “${esc((st?a.feedback:a.employer_review)||"No comment")}”</span></div></div>`}).join("")||'<p class="note">No reviews yet. They appear after completed gigs.</p>'}</div>${todo.length?`<div class="card" style="margin-top:16px"><h3>Write a review</h3>${todo.map(a=>`<div class="row"><span>${esc(gg(a.gig_id)?.t||"")} · ${esc(en(gg(a.gig_id)||{}))}</span><button class="btn sm sun" onclick="rateEmp(${a.id})">Review employer</button></div>`).join("")}</div>`:""}`}
function rateEmp(id){modal(`<h2>Review the employer</h2>${stars("re")}<label>Your review (optional)</label><textarea id="rv" placeholder="Was the employer clear, fair and on time with pay?"></textarea><p><button class="btn sun" onclick="const v=+$('#re').dataset.v,t=$('#rv').value;closeM();act(sb.from('applications').update({employer_rating:v,employer_review:t||null}).eq('id',${id}),'Thanks for your review!')">Submit</button></p>`)}
async function ecard(id){const e=S.emp[id]||{},n=S.gigs.filter(g=>g.eid==id&&g.st=="open").length;modal(`<h2>${esc(e.name||"Employer")}</h2><p>${e.verified?'<span class="chip v">✔ Verified employer</span>':'<span class="chip" style="border-style:dashed">⚠ Unverified</span>'}${e.rating?`<span class="chip sun">⭐ ${e.rating}</span>`:""}<span class="chip">${esc(e.municipality||"")}</span></p><p class="note">${n} open gig(s) right now.</p><h3>Reviews from students</h3><div id="er"><p class="note">Loading…</p></div><button class="btn alt" onclick="closeM()">Close</button>`);const r=await sb.from("employer_reviews").select("*").eq("employer_id",id).order("created_at",{ascending:false}).limit(8);$("#er").innerHTML=(r.data||[]).map(x=>`<div class="row"><span><b>${"⭐".repeat(x.rating)}</b> ${esc(x.student)}<br><span class="note">${esc(x.title)}: “${esc(x.review||"No comment")}”</span></span></div>`).join("")||'<p class="note">No reviews yet.</p>'}
async function viewS(id){const s=S.stu[id]||{},en2=Object.entries(s.endorsements||{});modal(`<h2>${esc(s.full_name||"Student")}</h2><p>${trChip(id)}<span class="chip">${esc(s.municipality||"")}</span>${s.age<18?`<span class="chip sun">Minor · consent ${s.consent_status=="verified"?"✔ verified":"⏳ pending"}</span>`:'<span class="chip v">Adult</span>'}</p><p class="note">${esc(s.school||"")}</p><h3>Skills</h3><p>${(s.skills||[]).map(x=>`<span class="sk">${esc(x)}${s.endorsements?.[x]?" · "+s.endorsements[x]+"✓":""}</span>`).join("")||'<span class="note">No skills listed yet.</span>'}</p>${en2.length?`<h3>Endorsed by employers</h3><p>${en2.map(([k,c])=>`<span class="sk">${esc(k)} · ${c}</span>`).join("")}</p>`:""}<h3>Track record</h3><p>${s.done||0} gigs completed${s.avg_rating?" · average ⭐ "+s.avg_rating:""}${s.no_shows?" · "+s.no_shows+" no-show(s)":""}</p><h3>Reviews from employers</h3><div id="sr"><p class="note">Loading…</p></div>${s.age<18?'<p class="note">Reminder: ages 15–17 get light work only, max 8 hrs, no night work.</p>':""}<p><button class="btn alt" onclick="closeM()">Close</button></p>`);const r=await sb.from("student_reviews").select("*").eq("student_id",id).order("work_date",{ascending:false}).limit(8);$("#sr").innerHTML=(r.data||[]).map(x=>`<div class="row"><span><b>${"⭐".repeat(x.rating||0)}</b> ${esc(x.employer)} · ${esc(x.title)}<br><span class="note">“${esc(x.feedback||"No comment")}”</span></span></div>`).join("")||'<p class="note">No reviews yet. First-time student: give clear instructions and be patient.</p>'}

addEventListener("hashchange",async()=>{CUR="";render();scrollTo(0,0);if(S.user||route()!="home"){await load();if(!$("#mod")&&!dirty())render()}});
let sb;
if(!window.supabase){$("#app").innerHTML='<section class="card"><h2>Could not load</h2><p>The Giglet database library failed to load. Check your internet connection and refresh.</p></section>'}
else{sb=supabase.createClient(SB_URL,SB_KEY);render();
 sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(async()=>{const nu=ses?.user||null,changed=(nu?.id||null)!==(S.user?.id||null);S.user=nu;
  if(ev=="PASSWORD_RECOVERY"){recov();return}
  if(ev=="TOKEN_REFRESHED"||(ev=="SIGNED_IN"&&!changed&&S.ready))return;

  if(ev=="SIGNED_IN"&&changed&&(r=="login"||r=="signup"))go(dash());else if(ev=="SIGNED_OUT"){go("home");render()}else render()},0)});
